name: Release after main merge

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Calculate version from PR labels
        id: version
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          latest=$(git tag -l 'v[0-9]*' --sort=-version:refname | head -n1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          case " $LABELS " in
            *" version:major "*) major=$((major + 1)); minor=0; patch=0 ;;
            *" version:minor "*) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          echo "value=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION (PR #$PR_NUMBER)"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --notes "PR #$PR_NUMBER — $PR_TITLE"
