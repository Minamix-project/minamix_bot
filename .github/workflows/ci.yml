name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: reminder_test
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m compileall -q main.py src tests
      - run: python -m pytest -q
        env:
          REMINDER_TEST_DB_PORT: ${{ job.services.mysql.ports[3306] }}
