services:
  db:
    image: mysql:8.4.8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_VERSION: ${BOT_VERSION:-dev}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      DEPLOY_NOTIFICATION: ${DEPLOY_NOTIFICATION:-0}
    volumes:
      - ./backups:/app/backups:ro
      - ./backup_test_status:/app/backup_test_status:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: mysql:8.4.8
    restart: unless-stopped
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        umask 077
        backup() {
          timestamp=$$(date -u +%Y-%m-%dT%H-%M-%SZ)
          target="/backups/$$DB_NAME-$$timestamp.sql"
          temp="$$target.tmp"
          MYSQL_PWD="$$DB_PASSWORD" mysqldump --no-tablespaces -h db -u "$$DB_USER" "$$DB_NAME" > "$$temp"
          mv "$$temp" "$$target"
          find /backups -type f -name '*.sql' -mtime "+$$BACKUP_RETENTION_DAYS" -delete
        }
        trap 'backup; exit 0' INT TERM
        while true; do
          backup
          sleep "$$BACKUP_INTERVAL_SECONDS" & wait $$!
        done

  backup-test-db:
    image: mysql:8.4.8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${BACKUP_TEST_ROOT_PASSWORD:?BACKUP_TEST_ROOT_PASSWORD must be set}
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root"]
      interval: 5s
      timeout: 5s
      retries: 20

  backup-test:
    image: mysql:8.4.8
    restart: unless-stopped
    environment:
      DB_NAME: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${BACKUP_TEST_ROOT_PASSWORD:?BACKUP_TEST_ROOT_PASSWORD must be set}
      BACKUP_TEST_INTERVAL_SECONDS: ${BACKUP_TEST_INTERVAL_SECONDS:-86400}
    depends_on:
      backup-test-db:
        condition: service_healthy
    volumes:
      - ./backups:/backups:ro
      - ./backup_test_status:/status
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        write_status() {
          ts=$$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"file":"%s","status":"%s","detail":"%s","tested_at":"%s"}' "$$1" "$$2" "$$3" "$$ts" > /status/last_restore_test.json.tmp
          mv /status/last_restore_test.json.tmp /status/last_restore_test.json
        }
        test_restore() {
          latest=$$(ls -t /backups/*.sql 2>/dev/null | head -1 || true)
          if [ -z "$$latest" ]; then
            write_status "" "no_backup" "Aucun dump trouve dans /backups"
            return
          fi
          testdb="$${DB_NAME}_backup_test"
          attempts=0
          until MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h backup-test-db -uroot --silent; do
            attempts=$$((attempts + 1))
            if [ "$$attempts" -ge 30 ]; then
              write_status "$$(basename $$latest)" "fail" "Base de test MySQL indisponible apres 60 secondes"
              return
            fi
            sleep 2
          done
          MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h backup-test-db -uroot -e "DROP DATABASE IF EXISTS \`$$testdb\`; CREATE DATABASE \`$$testdb\`;"
          if MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h backup-test-db -uroot "$$testdb" < "$$latest" 2>/tmp/restore_error.log; then
            tablecount=$$(MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h backup-test-db -uroot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='$$testdb';")
            write_status "$$(basename $$latest)" "ok" "Restauration reussie, $$tablecount tables"
          else
            write_status "$$(basename $$latest)" "fail" "Echec de restauration (voir logs du conteneur)"
            cat /tmp/restore_error.log || true
          fi
          MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h backup-test-db -uroot -e "DROP DATABASE IF EXISTS \`$$testdb\`;"
        }
        trap 'test_restore; exit 0' INT TERM
        while true; do
          test_restore
          sleep "$$BACKUP_TEST_INTERVAL_SECONDS" & wait $$!
        done

volumes:
  mysql_data:
